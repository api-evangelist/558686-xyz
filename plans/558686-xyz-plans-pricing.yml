summary: >-
  GPT55 publishes machine-readable pricing at /pricing.json and /x402/live-prices.json and says
  the live 402 quote, not either document, is authoritative at the moment of payment ("Fetch the
  target GPT55 route without X-PAYMENT immediately before paying; live 402 quotes are the source
  of truth"). Everything is pay-per-request in exact USDC on Base with no account: GPT-5.6 Luna
  Standard chat $0.00293, gpt-5.3-codex $0.007472, gpt-5.4 $0.010109, gpt-5.5 and GPT-5.6 Luna
  $0.019999, GPT-5.6 Terra $0.049998, GPT-5.6 Soul $0.099995, a metered route capped at
  $0.523889, utility tools $0.001-$0.002, x402 buyer/seller tools $0.004-$0.029, and premium
  "pack"/"playbook" agents $2.90-$36.90. Repeat buyers get prepaid call packs (100/500/2000/10000
  calls per model, e.g. Luna 100 for $1.60 = 80% of per-call). Text tools come in Standard
  (gpt-5.6-luna, $0.00293), Plus and Professional (gpt-5.5, $0.145-$0.211) tiers. Token-metered
  "upto" pricing is disabled. Sub2API is priced the other way round: prepaid platform quota
  bought through shop.400860.xyz at 1 USD paid = 10 USD quota, then per-1M-token model prices
  (gpt-5.5 $2.50 in / $15.00 out quota, i.e. $0.25 / $1.50 paid), with registration currently
  closed. No free tier exists on either surface; the only free calls are GPT55's /v1/models, the
  /api-market utilities and every discovery document.
