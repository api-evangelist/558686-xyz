conformance:
  spec: A2A 1.0.0
  grade: conformant
  grade_basis: >-
    All three hard checks pass: capabilities is an OBJECT ({streaming: false, tools: true, paid:
    true}), protocolVersion is present ("1.0"), and skills is an ARRAY of five entries each
    carrying id, name, description, tags, examples, inputModes and outputModes. The optional
    fields that separate conformant from near-conformant are all present: preferredTransport
    ("JSONRPC"), defaultInputModes ([application/json]) and defaultOutputModes
    ([application/json]). The card also carries provider, documentationUrl and version. The
    grade is about the document's shape; see deviations for the non-spec vocabulary it uses
    around that shape and for the retired host one of its blocks points at.
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  deviations:
    - id: supportedInterfaces-not-additionalInterfaces
      severity: soft
      detail: >-
        Secondary transports are declared under supportedInterfaces
        ([{url: https://gpt55.558686.xyz/a2a, protocolBinding: JSONRPC, protocolVersion: "1.0"}]);
        A2A names this field additionalInterfaces and its members AgentInterface {url, transport}.
        An A2A client reading the spec field sees no additional interfaces, which is harmless
        here because the one interface listed is the same as url/preferredTransport.
    - id: capabilities-non-spec-keys
      severity: soft
      detail: >-
        capabilities is an object, but its keys are streaming (spec), tools and paid (not in the
        spec); pushNotifications and stateTransitionHistory are absent (they default to false)
        and no extensions[] is declared. "paid" is the card's way of saying every skill costs
        USDC, which A2A has no field for.
    - id: authentication-legacy-shape
      severity: soft
      detail: >-
        Credentials are declared as authentication: [{schemes: ["x402"]}] - the pre-0.2 shape -
        instead of securitySchemes + security. x402 is not an OpenAPI security scheme type, so
        there is no conformant way to express it; the card also carries payment.accepts[] with
        the x402 v2 requirement (scheme exact, network eip155:8453, asset USDC contract
        0x8335...2913, payTo 0x1f01...9a2f) which is what a paying client actually needs.
    - id: non-spec-top-level-keys
      severity: informational
      detail: >-
        origin, display_name, payout_address, keyPackDeliveryTrial, links, payments, intents,
        payment, x402, endpoints and rateLimit ({rpm: 120}) are not A2A fields. They read as a
        merged x402 / agents402 service descriptor; a strict A2A parser ignores them.
    - id: keyPackDeliveryTrial-points-at-retired-host
      severity: hard-in-practice
      detail: >-
        keyPackDeliveryTrial.paidUrl is https://x402-key.558686.xyz/v1/paid/api-codex-key-pack-1
        and its quoteUrl / paymentActivation / firstPaymentClient are on the same host. That host
        answers HTTP 410 {retired: true, retiredProject: x402-key-url-tools, canonicalUrl:
        https://gpt55.558686.xyz/v1/paid/api-codex-key-pack-1, paymentRequiredHere: false}
        (probed 2026-09-20). The provider's own split.json says paid routes are not available on
        the historical host; the card has not been updated to match.
    - id: skills-tag-list-copied-across-skills
      severity: informational
      detail: >-
        gpt55-chat-completions carries 58 tags; the other four skills each carry the same first
        16 of them (ai, llm, gpt-5.5, chat, ... translate, translation) regardless of what the
        skill does, so tags do not discriminate between skills.
    - id: endpoint-answers-jsonrpc
      severity: positive
      detail: >-
        POST https://gpt55.558686.xyz/a2a with {"jsonrpc":"2.0","id":1,"method":"agent/getAuthenticatedExtendedCard"}
        returned HTTP 200 {"jsonrpc":"2.0","id":1,"error":{"code":-32601,"message":"Method not
        found: agent/getAuthenticatedExtendedCard"}} - a live JSON-RPC 2.0 endpoint. GET on the
        same path is 404. message/send was NOT exercised: every skill is priced, and this pass
