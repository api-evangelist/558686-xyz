    media_type: text/plain
    shape: '404 page not found'
    note: 'Go net/http default for unknown /v1/* paths (e.g. /v1/openapi.json, /api/v1/models).'
  sub2api_static_docs_server:
    media_type: text/html
    shape: 'HTML "Error response" page with "Error code: 501" and "Message: Unsupported method (''POST'')"'
    note: 'Returned for POST to /mcp, /mcp/, /sse and /graphql on sub2api.558686.xyz - the static docs host does not accept POST; these paths are not services.'
