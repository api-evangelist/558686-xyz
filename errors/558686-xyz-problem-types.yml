    shape: '{ "error": { "message": string, "type": string } }'
    types_observed: [invalid_request_error, not_found]
    note: 'OpenAI-style envelope; no code, param or request id field. No x-request-id header on gpt55 responses.'
  gpt55_payment_required:
    media_type: application/json
    shape: '{ "x402Version": 2, "error": "Payment required", "resource": {url, description, mimeType, serviceName, tags, iconUrl, category}, "accepts": [{scheme, network, amount, asset, payTo, maxTimeoutSeconds, extra}], "extensions": {"bazaar": {info {input, output}, schema}} }'
    header: 'PAYMENT-REQUIRED: <base64 of the same JSON>'
    note: 'A 402 is the normal quote step, not a failure: the same request is retried with X-PAYMENT. It is returned for every paid route regardless of body validity when no payment header is present (an empty {} body and an invalid X-PAYMENT header both produced the plain 402 quote).'
