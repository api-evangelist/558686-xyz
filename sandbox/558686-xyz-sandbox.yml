summary: >-
  There is no test network, test key or sandbox environment: GPT55 settles only real USDC on Base
  mainnet and Sub2API only debits real platform quota. What the provider publishes instead is a
  graduated rehearsal path. (1) Quote-only: any paid route called without X-PAYMENT returns the
  402 quote and executes nothing - the provider's buyer client runs in this mode by default and
  the call-pack routes accept quote_only=true. (2) A $0.002 settlement proof, /v1/x402-ping, that
  makes no upstream model call ("Use /v1/x402-ping first to prove settlement before paid model
  calls"). (3) A $0.00293 "translate canary" (POST /v1/tools/translate) as the smallest real
  model-backed payment before buying chat or a pack. (4) Free reads that need nothing: GET
  /v1/models and the /api-market utility routes. For Sub2API the guide is procedural - obtain an
  administrator test key while registration is closed, confirm balance, call GET /v1/models, then
  the smallest chat request - with no published test values.
