summary: >-
  GPT55 ships a hosted, remote, Streamable HTTP MCP server at https://gpt55.558686.xyz/mcp that
  answers initialize (protocolVersion 2025-06-18), tools/list (218 tools with JSON Schema
  inputSchema and annotations) and resources/list (14 JSON resources) with no credential. It is,
  by its own instructions, a discovery facade over the x402-paid HTTP API: "Tool calls return the
  direct HTTP endpoint, x402 payment requirements, and example payload. Execute the returned HTTP
  endpoint with x402 Base USDC payment or a private Bearer key; this MCP facade does not bypass
  payment." So an agent can enumerate and understand every tool anonymously, and every useful
  result still costs a per-request USDC payment made outside MCP. The public repository ships a
  local Node wrapper (`npm start` -> node server.mjs) that exposes "one local read-only directory
  tool" and is not published to a registry; it is not a second, equivalent server. No entry
  exists in the official MCP registry (registry.modelcontextprotocol.io) and llms-install.md says
  "No external marketplace submission has been made", although the manifest is written in the
  registry's server.json schema.
