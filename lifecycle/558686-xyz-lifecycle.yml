summary: >-
  GPT55 is a live, actively regenerated service (every JSON manifest carries a generatedAt within
  the probe minute) that has been through one documented restructuring: in July 2026 four
  standalone x402 sub-projects on their own hosts (x402-utils, x402-wallet, x402-seller, x402-key
  .558686.xyz) were "retired_consolidated" into the single GPT55 host. The provider publishes the
  retirement as data - /projects/split.json states a 30-day legacy notice starting 2026-07-01,
  names each retired project's historical and canonical origin, and says paid routes are no
  longer available on the historical hosts - and enforces it at the edge: every path on a retired
  host answers HTTP 410 Gone with a JSON notice carrying canonicalUrl and paymentRequiredHere
  false, and the discovery paths 308 to the canonical host. No Sunset or Deprecation header is
  sent. The OpenAPI describes itself as the "Reduced GPT55 public surface after x402 project
  split" and lists the retired projects in info.x-gpt55-relatedProjects. Versioning is a /v1
  path prefix plus date-stamped manifest versions; there is no changelog, no SLA, no
  human-readable status page - /x402/status is a JSON settlement/facilitator health document that
  shows most of the provider's payment facilitators frozen and one (xpay) active. The agent card
  still points its key-pack trial at the retired x402-key host. Sub2API's public copy is frozen
  at a 2026-06-28 capture with docs edited 2026-08-31; its registration is closed.
