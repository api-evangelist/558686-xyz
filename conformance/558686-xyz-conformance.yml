source: >-
  The three provider OpenAPIs under openapi/ (live 2026-09-19), a2a/558686-xyz-agent-card.json,
  well-known/ (live probes with negative controls), mcp/558686-xyz-mcp-initialize.json and
  -tools-list.json (live JSON-RPC), https://gpt55.558686.xyz/buyer-guide, /llms.txt,
  /llms-full.txt, /robots.txt, /x402/status, /projects/split.json, the response headers observed
  on GET /v1/models and on unpaid POSTs (402), https://sub2api.558686.xyz/apis.json, /openapi.json,
  /docs/, and the repository wangletiand/gpt55-x402-gateway (README, SECURITY.md, package.json).
checked: '2026-09-19'
summary: >-
  GPT55 conforms, observably, to the agent-facing stack it advertises: x402 v2 (a live 402 with
  PAYMENT-REQUIRED header and accepts[] on every paid route), MCP 2025-06-18 over Streamable HTTP
  (initialize + tools/list + resources/list anonymous), the MCP registry server.json schema and
  the SEP-1649 server card, an A2A 1.0 agent card graded conformant at the canonical path, JSON-RPC
  2.0 on /a2a, the OpenAI chat-completions request/response shape (its market's de facto domain
  standard, declared in the contract paths and enumerated model/messages/max_tokens/stream inputs),
  IETF RateLimit header fields, llms.txt, an OpenAI plugin manifest, an agents402 0.1 manifest,
  Content-Signals in robots.txt, HSTS and CORS. It conforms to none of the classic HTTP security
  and error conventions: no OAuth 2.0 / OIDC / RFC 8414 / RFC 9728 metadata (payment is the gate,
  there is no identity layer), no RFC 9116 security.txt (the disclosure policy is a SECURITY.md on
  GitHub), no RFC 9457 problem details (errors are {error {message, type}}), no RFC 9727 API
  catalog, no RFC 8594 Sunset/Deprecation headers on the retired hosts (they answer 410 Gone with a
  JSON notice), no AsyncAPI or GraphQL. Sub2API's surface conforms to OpenAPI 3.1, APIs.json 0.16,
  llms.txt and the OpenAI-compatible shape, with Bearer/x-api-key auth and a {code, message} error
  envelope. No compliance program or certification is published anywhere, so no Compliance pointer.
