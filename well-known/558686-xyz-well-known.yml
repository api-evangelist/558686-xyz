summary: >-
  One host serves real documents: the API/MCP/A2A host gpt55.558686.xyz. It answers a real JSON
  404 ({"error":{"message":"Not found","type":"not_found"}}) for unknown paths and for the
  negative control, so its 200s are documents, not a catch-all. Served there: an ai-plugin.json
  (OpenAI plugin manifest naming /openapi.json), an MCP server.json-shaped manifest at
  /.well-known/mcp.json (MCP registry schema 2025-12-11), a SEP-1649 MCP server card at
  /.well-known/mcp/server-card.json, the x402 v2 discovery document at /.well-known/x402, an
  agents402 0.1 manifest, an ai-catalog.json, and the A2A agent card at both agent-card.json and
  agent.json (graded in a2a/). It serves NO RFC 9116 security.txt, no OIDC discovery, no RFC 8414
  / RFC 9728 OAuth metadata, no RFC 9727 api-catalog, no UCP/ACP, no AAuth, and no apis.json at
  /.well-known/apis.json or /apis.yml; its /apis.json is a 200 JSON document with an apis[] array
  but no name/specificationVersion, so it is recorded as a non-conformant APIs.json-shaped
  index. The registrable domain 558686.xyz 301s every path to sub2api.558686.xyz. The two
  Sub2API console hosts (sub2api.558686.xyz, api.558686.xyz) are SPA catch-alls: 200 text/html
  62,944 bytes for every /.well-known/* path AND for the negative control, so nothing there
  counts - except that sub2api.558686.xyz genuinely serves /apis.json (983 B, specificationVersion
  0.16, one API), /openapi.json and /llms.txt as real documents. The four retired split hosts
  answer 410 (or 308 to the canonical host) with a JSON retirement notice on every path.
pointer_basis: >-
