  types: [x402-payment, http-bearer, api-key-header]
  note: >-
    Two different models on two hosts. GPT55 has NO identity credential for the public: every
    paid route is gated by an x402 payment presented in the X-PAYMENT header after a 402 quote,
    and the discovery/metadata surface (GET /v1/models, MCP initialize/tools/list/resources/list,
    every JSON manifest, the /api-market utilities) is fully anonymous. A private Bearer token
    exists but is documented as an operator-only bypass, not a public option. Sub2API is a
    conventional API-key relay: Authorization: Bearer <key> (also x-api-key or a query key),
    with keys created in a console whose self-service registration is currently closed.
