aid: 558686-xyz
name: gpt55-token-gateway
description: >-
  gpt55-token-gateway is the self-chosen service name of an unnamed operator running two
  OpenAI-compatible AI API gateways on the 558686.xyz domain. GPT55 Model Gateway
  (gpt55.558686.xyz) sells single GPT-5.6 Luna, GPT-5.5 and GPT-5.3-codex chat completions,
  deterministic text and wallet tools, and prepaid call packs per request over the x402 payment
  protocol (HTTP 402 quote, exact USDC on Base eip155:8453, payTo 0x1f01...9a2f) with no account
  and no API key, and publishes an OpenAPI 3.1 contract (37 operations), a remote MCP server at
  /mcp that answers initialize and tools/list anonymously with 218 tools, an A2A 1.0 agent card,
  an MCP registry server.json, an ai-plugin.json, an x402 discovery document, pricing and
  live-price JSON, a Postman collection, llms.txt and a Content-Signal robots.txt. A second,
  free, unauthenticated REST surface of 44 developer utilities is served under /api-market for
  API.market import. Sub2API (sub2api.558686.xyz, also api.558686.xyz) is a self-hosted
  deployment of the open-source Wei-Shaw/sub2api relay that resells GPT, Claude and Gemini
  models by Bearer API key at a 1 USD paid = 10 USD platform-quota ratio, with a 3-operation
  OpenAPI, an APIs.json index, Chinese-language docs and public registration currently closed.
  Four retired split hosts (x402-utils, x402-wallet, x402-seller, x402-key.558686.xyz) answer
  HTTP 410 with retirement notices pointing back to GPT55. Source repository
  github.com/wangletiand/gpt55-x402-gateway (MIT); the security contact ops@400860.xyz and the
  Sub2API recharge shop shop.400860.xyz tie the operator to the sibling 400860.xyz record.
