apis:
- aid: 558686-xyz:gpt55-model-gateway-api
  name: GPT55 Model Gateway API
  description: >-
    OpenAI-compatible, x402-paid model gateway at https://gpt55.558686.xyz. The provider's own
    OpenAPI 3.1.0 document declares 37 operations on servers[] https://gpt55.558686.xyz, every one
    with a unique operationId and a summary: GET /v1/models (answers 200 anonymously with seven
    model ids and per-model pricing), POST /v1/chat/completions plus model-specific routes
    (/standard, /gpt-5.6-sol, /gpt-5.6-luna, /gpt-5.6-terra, /gpt-5.6, /gpt-5.5, /gpt-5.3-codex,
    /metered), GET quote routes for 100-call prepaid packs, POST text tools (translate in three
    tiers, summarize, rewrite, answer, code-review, extract-json), three Sub2API billing helpers,
    and retained deterministic tools (timestamp, query-parse, EVM wallet balance, x402 MCP
    integration kit, x402 Bazaar search, wallet signing safety pack). Every paid operation
    documents a 200 and a 402; an unpaid request returns the x402 v2 quote (PAYMENT-REQUIRED
    header + JSON accepts[]) and the same request is retried with X-PAYMENT. Prices are carried
    in x-x402-price / x-gpt55-product on each operation; the spec declares no securitySchemes
    and no components.schemas.
  humanURL: https://gpt55.558686.xyz/x402/service
