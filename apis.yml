- aid: 558686-xyz:gpt55-mcp-server
  name: GPT55 x402 Gateway MCP Server
  description: >-
    Remote Model Context Protocol server at https://gpt55.558686.xyz/mcp (Streamable HTTP; a
    GET returns the server.json-shaped manifest and /mcp/sse streams the discovery config).
    Probed anonymously on 2026-09-20: initialize answered protocolVersion 2025-06-18, serverInfo
    {gpt55-x402-gateway, "GPT-5.5 x402 Agent Payment Control Plane", 2026.06.21}, capabilities
    tools + resources; tools/list returned 218 tools, each with a JSON Schema inputSchema and MCP
    annotations; resources/list returned 14 JSON resources (x402 discovery, live prices,
    pricing, buyer guide, agent card, openapi). The server's own instructions state that it is a
    facade: a tool call returns the direct HTTP endpoint, the x402 payment requirements and an
    example payload, and the caller must execute that HTTP endpoint with x402 Base USDC payment
    or a private Bearer key - "this MCP facade does not bypass payment". Registered-shape
    server.json at /server.json and /.well-known/mcp.json (name gpt55-model-gateway, version
    2026.07.01-split) and a SEP-1649 server card at /.well-known/mcp/server-card.json
    (xyz.558686.gpt55/token-gateway); no entry was found in the official MCP registry and the
    install guide says no marketplace submission has been made.
  humanURL: https://gpt55.558686.xyz/projects/558686/install
  baseURL: https://gpt55.558686.xyz/mcp
