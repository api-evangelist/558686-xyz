- aid: 558686-xyz:gpt55-utility-tools-api-market
  name: GPT-5.5 Utility Tools for API.market
  description: >-
    A second, ordinary REST contract the same host serves for API.market source import: OpenAPI
    3.1.0 at https://gpt55.558686.xyz/api-market/openapi.json with servers[]
    https://gpt55.558686.xyz/api-market and 44 operations (GET and POST pairs) over 22
    deterministic developer utilities - text-stats, hash-text, base64-codec, url-parse,
    timestamp, jwt-decode, slugify, case-convert, regex-match, html-strip, query-parse,
    unique/sort/diff lines, json-minify, uri-codec, html-entity-codec, email-normalize,
    domain-extract, color-convert, uuid, json-keys. The spec says these call no LLM and fetch no
    remote URL and that commercial access, subscriber authentication, quotas and billing are
    configured in API.market; on the provider's own host they answered HTTP 200 anonymously with
    no payment (GET /api-market/v1/tools/timestamp?value=1700000000 and
    /api-market/v1/tools/text-stats?text=... on 2026-09-20), each response carrying an x402Lead
    block pointing at the paid GPT55 chat tiers. No securitySchemes are declared.
  humanURL: https://gpt55.558686.xyz/api-market
  baseURL: https://gpt55.558686.xyz/api-market
