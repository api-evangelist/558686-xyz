- aid: 558686-xyz:sub2api-openai-compatible-api
  name: Sub2API OpenAI-compatible API
  description: >-
    The operator's Sub2API deployment at https://sub2api.558686.xyz (the same backend also
    answers on api.558686.xyz, whose console is Chinese-language): a Bearer-API-key relay that
    resells GPT-5.5, GPT-5.4, GPT-5.3-codex, Claude Opus 4.6 / Sonnet 4.6 / Haiku 4.5 and Gemini
    models through GET /v1/models, POST /v1/chat/completions and POST /v1/responses, documented in
    a provider-published OpenAPI 3.1.0 (3 operations, bearerAuth http scheme, servers[]
    https://sub2api.558686.xyz). Unauthenticated calls return 401 {code: API_KEY_REQUIRED};
    accepted credentials are Authorization: Bearer, x-api-key, or a query key. Billing is
    platform quota bought at 1 USD paid = 10 USD platform quota through shop.400860.xyz; the
    site's own read-only status says public registration and Google OAuth sign-up are closed and
    a test key must be requested from the administrator. The software is the open-source
    Wei-Shaw/sub2api project; the deployment, its spec, apis.json, llms.txt, pricing page,
    Postman collection and Chinese docs (Codex install + API access guide) are this operator's.
  humanURL: https://sub2api.558686.xyz/docs/
  baseURL: https://sub2api.558686.xyz
