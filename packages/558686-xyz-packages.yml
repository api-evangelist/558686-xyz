  note: >-
    The provider publishes NOTHING to a package registry. Its one distributable client is a
    single-file Node script, first-payment-client.mjs, served from its own host
    (https://gpt55.558686.xyz/x402/first-payment-client.mjs, 111,875 B, text/javascript) and
    mirrored in the public repository root and examples/x402-first-payment-client. It is a real
    first-party client for the API - it fetches the 402 quote, validates amount/network/asset/
    payTo against local policy, and (only when PAY_REAL_X402=1) signs and retries with the buyer's
    key kept in the buyer's process - so SDKs is emitted on that basis, with the caveat that it is
    a script to download, not a library to install. The repository package gpt55-x402-gateway
    (1.0.0, MIT, "private": true) is the local MCP wrapper + that client and is not on npm. For
    everything else the docs point buyers at third-party libraries: the official x402 client
    packages (@x402/fetch, @x402/evm) with viem for Base wallets, and the OpenAI SDKs (base_url
    override) for Sub2API. The PyPI package `sub2api` (0.2.0, Eight Labs, "Python client for the
    user-facing API of Sub2API instances") targets the open-source Sub2API software generically,
    not this deployment, and is not first-party; the npm results for "gpt55" (pi-gpt55-complete,
    @devinilabs/reelstack) are unrelated.
  currency_note: >-
    Neither first-party artifact carries a version string a consumer can read: the script
    embeds none (it identifies its contract only by the companion JSON's schemaVersion 2026-06-21
    and x402ProtocolVersion v2) and the repository has no releases or tags, so `version: null`
