openapi: 3.2.0
info:
  title: Sub2API OpenAI-compatible Responses API
  version: '2026-06-28'
  description: Core OpenAI-compatible routes for sub2api. No secrets are included.
servers:
- url: https://sub2api.558686.xyz
tags:
- name: Responses
paths:
  /v1/responses:
    post:
      summary: Create a Responses API response
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Response object
        '401':
          description: Missing or invalid API key
      tags:
      - Responses
      operationId: postV1Responses
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
