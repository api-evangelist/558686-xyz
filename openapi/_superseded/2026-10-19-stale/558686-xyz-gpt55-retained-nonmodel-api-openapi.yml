              additionalProperties: true
            example:
              base_url: https://gpt55.558686.xyz
              service_name: GPT55 Model Gateway
              max_usdc_per_call: 0.02
              preferred_endpoint: https://gpt55.558686.xyz/v1/chat/completions
      description: Deterministic MCP and x402 buyer onboarding package with Claude, curl, spend-cap, payment-client, and receipt-gate configuration. No upstream model call is made.
      x-output-example:
        ok: true
        tool: x402McpIntegrationKit
        paidResult: true
        mcpRuntimeInstallPlan:
          remoteMcpServer: https://gpt55.558686.xyz/mcp
          configUrl: https://gpt55.558686.xyz/mcp/config
          claudeDesktopConfigJson: '{"mcpServers":{"gpt-5-6-x402-gateway":{"type":"streamable-http","url":"https://gpt55.558686.xyz/mcp"}}}'
        buyerMcpExecutionContract:
          quoteBeforeToolCall: true
          sameRequestRetry: true
          expectedNetwork: eip155:8453
          expectedAsset: USDC
          expectedPayTo: '0x1f0130669ca6fd02e025a984cc038f139df19a2f'
          authType: x402 payment header, not API key
        receiptGate:
          requiredAfterPayment: true
          requiredHeaders:
          - x-x402-receipt-id
          - x-x402-receipt-url
          receiptUrlTemplate: https://gpt55.558686.xyz/x402/receipts/{receiptId}
        mcpPaidToolOnboardingPackage:
          version: 2026-07-13.mcp-paid-tool-onboarding.v1
          buyerOwnedRuntime: true
          paymentSentByThisService: false
          includes:
          - claudeDesktopConfigJson
          - x402PaymentClientHandoff
          - spendPolicy
          - receiptGateConfig
          - firstPaidCallRunbook
          - firstPurchaseSuccessCriteria
          - officialClientCompatibility
        claudeDesktopConfigJson: '{"mcpServers":{"gpt-5-6-x402-gateway":{"type":"streamable-http","url":"https://gpt55.558686.xyz/mcp"}}}'
        x402PaymentClientHandoff:
          quoteFirst: true
          paidEndpoint: https://gpt55.558686.xyz/v1/tools/x402-mcp-integration-kit
          paymentHeader: X-PAYMENT
          privateKeySentToService: false
          paymentSentByThisService: false
        spendPolicy:
          maxUsdcPerCall: 0.02
          network: eip155:8453
          asset: USDC
          payTo: '0x1f0130669ca6fd02e025a984cc038f139df19a2f'
          stopOnMismatch: true
        receiptGateConfig:
          requiredHeaders:
          - x-x402-receipt-id
          - x-x402-receipt-url
          storeReceiptWithPaidResult: true
          receiptUrlTemplate: https://gpt55.558686.xyz/x402/receipts/{receiptId}
        firstPaidCallRunbook:
        - Fetch the paid endpoint without X-PAYMENT and read the HTTP 402 quote.
        - Verify amount, payTo, network, asset, and the buyer spend cap.
        - Retry the exact same method, URL, body, and content-type with a buyer-owned X-PAYMENT header.
        - Store x-x402-receipt-id and x-x402-receipt-url with the paid result before installing the MCP config.
        firstPurchaseSuccessCriteria:
          quoteStep: HTTP 402 includes amount, payTo, network, asset, and accepted scheme.
          paymentStep: Retry the exact same request with X-PAYMENT created by the buyer wallet.
          paidStep: HTTP 200 JSON includes the MCP install plan and receipt gate fields.
          receiptHeaders:
          - x-x402-receipt-id
          - x-x402-receipt-url
        officialClientCompatibility:
          header: X-PAYMENT
          quoteFirst: true
          sameRequestRetry: true
          privateKeySentToService: false
          retryInvariant:
          - method
          - url
          - body
          - content-type
        sameRequestRetry:
          method: POST
          url: https://gpt55.558686.xyz/v1/tools/x402-mcp-integration-kit
          keepUnchanged:
          - method
          - url
          - body
          - content-type
          addHeader: X-PAYMENT
        receiptEvidence:
          required: true
          headers:
          - x-x402-receipt-id
          - x-x402-receipt-url
          example:
            x-x402-receipt-id: '{receiptId}'
      x-gpt55-product:
        id: mcp-integration-kit
        price: $0.006
        amountAtomic: '6000'
        deterministic: true
        upstreamModelCall: false
        guide: https://gpt55.558686.xyz/x402/mcp-first-purchase-kit
        firstPaymentClient: https://gpt55.558686.xyz/x402/first-payment-client.mjs
        privateKeySentToService: false
