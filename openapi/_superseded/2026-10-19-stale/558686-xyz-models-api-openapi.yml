openapi: 3.2.0
info:
  title: Sub2API OpenAI-compatible Models API
  version: '2026-06-28'
  description: Core OpenAI-compatible routes for sub2api. No secrets are included.
servers:
- url: https://sub2api.558686.xyz
tags:
- name: Models
paths:
  /v1/models:
    get:
      summary: List models available to the API key
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Model list
        '401':
          description: Missing or invalid API key
      tags:
      - Models
      operationId: getV1Models
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
