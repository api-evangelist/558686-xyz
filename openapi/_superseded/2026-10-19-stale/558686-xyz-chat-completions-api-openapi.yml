openapi: 3.2.0
info:
  title: Sub2API OpenAI-compatible Chat API
  version: '2026-06-28'
  description: Core OpenAI-compatible routes for sub2api. No secrets are included.
servers:
- url: https://sub2api.558686.xyz
tags:
- name: Chat Completions
paths:
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Chat completion
        '401':
          description: Missing or invalid API key
      tags:
      - Chat Completions
      operationId: postV1ChatCompletions
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
