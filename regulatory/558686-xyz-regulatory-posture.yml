  legal page there is verifiable as served. The nearest thing to an AI-transparency statement is
  the robots.txt Content-Signal "search=yes,ai-train=no,use=reference" with GPTBot/ClaudeBot/
  Google-Extended disallowed - a machine-readable usage preference the operator asserts over ITS
  content, which is recorded as ContentSignal, not as ai_transparency (which is about disclosure
  of the provider's own AI outputs to users). The Sub2API docs carry a compliance sentence
  ("confirm your region and use case comply with service terms; do not provide region-restriction
  evasion guidance") without a terms document to point at. The GPT55 README states "This is a
  compatible gateway, not an OpenAI-operated product", and the Sub2API pages state no upstream
  partnership or authorization is claimed. Empty signals is the measurement.
